name: Build Bo lac thoi tien su APK

on:
  push:
    branches:
      - feature/bo-lac-thoi-tien-su-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bo-lac-thoi-tien-su-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build standalone debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOpenDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch game in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            APK="$(find app/build/outputs -name '*.apk' -print -quit)"; echo "APK path: ${APK:-NOT_FOUND}"; test -n "$APK" || { echo "No APK found under app/build/outputs"; find app/build/outputs -maxdepth 7 -print; exit 1; }; attempt=1; while [ "$attempt" -le 3 ]; do echo "Emulator health check attempt $attempt/3"; adb wait-for-device; boot_ok=0; for wait_sec in $(seq 1 90); do booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; package_state="$(adb shell service check package 2>/dev/null || true)"; activity_state="$(adb shell service check activity 2>/dev/null || true)"; if [ "$booted" = "1" ] && echo "$package_state" | grep -q found && echo "$activity_state" | grep -q found; then boot_ok=1; break; fi; sleep 2; done; if [ "$boot_ok" = "1" ]; then echo "Android boot and package/activity services are ready"; if adb install -r "$APK" && adb shell am force-stop com.tuananh.bolacthoitiensu.debug && adb shell am start -n com.tuananh.bolacthoitiensu.debug/ru.playsoftware.j2meloader.MainActivity; then sleep 90; adb shell input keyevent 20 || true; adb shell input keyevent 66 || true; sleep 5; adb shell input tap 640 710 || true; sleep 20; mkdir -p game-test-evidence; adb shell screencap -p /sdcard/game-screen.png && adb pull /sdcard/game-screen.png game-test-evidence/game-screen.png; adb shell dumpsys activity activities > /tmp/activities.txt; adb shell dumpsys activity | grep -E "mResumedActivity|topResumedActivity" > /tmp/resumed.txt || true; adb logcat -d -t 6000 > /tmp/game-logcat.txt; if grep -q "javax.microedition.shell.MicroActivity" /tmp/activities.txt && grep -q "MicroActivity" /tmp/resumed.txt && grep -q "loadMIDletList main: tribes" /tmp/game-logcat.txt && ! grep -E "FATAL EXCEPTION.*(com.tuananh.bolacthoitiensu|ru.playsoftware.j2meloader)|No MIDlets found|ClassNotFoundException.*tribes" /tmp/game-logcat.txt; then echo "PASS: embedded tribes MIDlet loaded, MicroActivity remained foreground, and no game-process crash was detected"; grep -E "EmbeddedGameInstaller|EmbeddedGameLaunch|tribes|MIDlet|MicroActivity|FATAL EXCEPTION|No MIDlets found" /tmp/game-logcat.txt | tail -n 160 || true; exit 0; fi; fi; else echo "Android services did not become healthy; skip install on this attempt"; fi; echo "Attempt $attempt failed; collecting diagnostics"; adb logcat -d -t 5000 > /tmp/game-logcat.txt 2>&1 || true; grep -E "EmbeddedGameInstaller|EmbeddedGameLaunch|tribes|MIDlet|MicroActivity|FATAL EXCEPTION|ANR|No MIDlets found|Dexing error" /tmp/game-logcat.txt | tail -n 180 || true; cat /tmp/activities.txt 2>/dev/null || true; cat /tmp/resumed.txt 2>/dev/null || true; if [ "$attempt" -lt 3 ]; then echo "Rebooting emulator before retry"; adb reboot || true; sleep 5; fi; attempt=$((attempt+1)); done; echo "FAIL: emulator/game did not pass health and launch checks after 3 attempts"; exit 1

      - name: Upload gameplay screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-screen-evidence
          path: game-test-evidence/game-screen.png
          if-no-files-found: warn
          retention-days: 14
