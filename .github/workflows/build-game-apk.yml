name: Build Bo lac thoi tien su APK

on:
  push:
    branches:
      - feature/bo-lac-thoi-tien-su-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bo-lac-thoi-tien-su-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build standalone debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOpenDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Download APK for emulator test
        uses: actions/download-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-APK
          path: ${{ github.workspace }}/emulator-apk

      - name: Install and launch game in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            set -u
            APK="$(find "${GITHUB_WORKSPACE}/emulator-apk" -name '*.apk' -print -quit)"
            echo "APK path: ${APK:-NOT_FOUND}"
            test -n "$APK" || { echo "No APK found"; exit 1; }
            mkdir -p game-test-evidence
            attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Emulator health check attempt $attempt/3"
              adb wait-for-device
              boot_ok=0
              for wait_sec in $(seq 1 90); do
                booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')"
                package_state="$(adb shell service check package 2>/dev/null || true)"
                activity_state="$(adb shell service check activity 2>/dev/null || true)"
                if [ "$booted" = "1" ] && echo "$package_state" | grep -q found && echo "$activity_state" | grep -q found; then
                  boot_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$boot_ok" != "1" ]; then
                echo "Android services did not become healthy"
              elif adb install -r "$APK"; then
                adb shell am force-stop com.tuananh.bolacthoitiensu.debug
                adb logcat -c
                echo "Launching standalone app and waiting for its own foreground activity"
                adb shell am start -W -n com.tuananh.bolacthoitiensu.debug/ru.playsoftware.j2meloader.MainActivity || true
                sleep 45
                adb shell screencap -p /sdcard/game-after-launch.png || true
                adb pull /sdcard/game-after-launch.png game-test-evidence/game-after-launch.png || true
                adb shell dumpsys activity activities > game-test-evidence/activities.txt 2>&1 || true
                adb shell dumpsys activity processes > game-test-evidence/processes.txt 2>&1 || true
                adb shell pidof com.tuananh.bolacthoitiensu.debug > game-test-evidence/app-pid.txt 2>&1 || true
                adb logcat -d -v threadtime > game-test-evidence/logcat-full.txt 2>&1 || true
                grep -E "EmbeddedGameInstaller|EmbeddedGameLaunch|AndroidRuntime|FATAL EXCEPTION|ANR|MicroActivity|tribes|MIDlet" game-test-evidence/logcat-full.txt | tail -n 300 > game-test-evidence/logcat-focused.txt || true
                if grep -q "javax.microedition.shell.MicroActivity" game-test-evidence/activities.txt &&
                   grep -q "MicroActivity" game-test-evidence/activities.txt &&
                   grep -q "loadMIDletList main: tribes" game-test-evidence/logcat-full.txt &&
                   [ -s game-test-evidence/app-pid.txt ] &&
                   ! grep -E "FATAL EXCEPTION.*(com.tuananh.bolacthoitiensu|ru.playsoftware.j2meloader)|No MIDlets found|ClassNotFoundException.*tribes" game-test-evidence/logcat-full.txt; then
                  echo "Game MIDlet is loaded and its activity remains present; beginning one controlled input test"
                  adb shell input keyevent 23 || true
                  sleep 8
                  adb shell screencap -p /sdcard/game-screen.png || true
                  adb pull /sdcard/game-screen.png game-test-evidence/game-screen.png || true
                  adb shell dumpsys activity activities > game-test-evidence/activities-after-input.txt 2>&1 || true
                  adb logcat -d -v threadtime > game-test-evidence/logcat-full.txt 2>&1 || true
                  if grep -q "javax.microedition.shell.MicroActivity" game-test-evidence/activities-after-input.txt &&
                     ! grep -E "FATAL EXCEPTION.*(com.tuananh.bolacthoitiensu|ru.playsoftware.j2meloader)" game-test-evidence/logcat-full.txt; then
                    echo "PASS: game activity survived launch and one confirm input"
                    exit 0
                  fi
                fi
              fi
              echo "Attempt $attempt failed; preserving full crash and activity diagnostics"
              if [ "$attempt" -lt 3 ]; then
                echo "Rebooting emulator before retry"
                adb reboot || true
                sleep 5
              fi
              attempt=$((attempt+1))
            done
            echo "FAIL: game did not remain in its own activity; inspect full logcat and activity evidence"
            exit 1

      - name: Upload gameplay screen evidence (before and after input probes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-screen-evidence
          path: game-test-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
